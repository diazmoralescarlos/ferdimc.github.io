<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>fer.dimc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --text:#111111; --muted:#6b6b6b; --line:#ececec; --soft:#f6f6f6;
    --pink:#ff2d87; --fs:1.1875rem;
  }
  [data-theme="dark"]{ --bg:#111111; --text:#f2f2f2; --muted:#9a9a9a; --line:#262626; --soft:#1a1a1a; --pink:#ff4f9a; }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Literata",Georgia,serif;
    font-size:var(--fs);line-height:1.75;transition:background .2s,color .2s}
  a{color:inherit}
  ::selection{background:var(--pink);color:#fff}
  .sans{font-family:"Inter",system-ui,sans-serif}
  .wrap{max-width:38rem;margin:0 auto;padding:0 1.25rem}
  .hash{color:var(--pink)}

  header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:3.5rem}
  .brand{font:600 1rem "Inter",system-ui,sans-serif;text-decoration:none;letter-spacing:.01em}
  .tools{display:flex;gap:.25rem}
  .btn{font:500 .85rem "Inter",system-ui,sans-serif;color:var(--text);background:none;border:1px solid transparent;
    border-radius:999px;min-width:2.5rem;height:2.5rem;padding:0 .75rem;cursor:pointer}
  .btn:hover,.btn:focus-visible{border-color:var(--line);outline:none}

  .intro{padding:3rem 0 .75rem}
  .intro h1{font:600 2rem/1.2 "Inter",system-ui,sans-serif;margin:0 0 .35rem;letter-spacing:-.02em}
  .intro p{margin:0;color:var(--muted);font:400 .95rem "Inter",system-ui,sans-serif}
  .controls{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0 .25rem}
  .pill{font:500 .8rem "Inter",system-ui,sans-serif;color:var(--text);background:none;border:1px solid var(--line);
    border-radius:999px;height:2.25rem;padding:0 .9rem;cursor:pointer}
  .pill[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--bg)}
  .review{margin:1.75rem 0 1rem;padding:.9rem 1rem;border-radius:.75rem;background:var(--soft);
    font:400 .8rem/1.5 "Inter",system-ui,sans-serif;color:var(--muted)}
  .review b{color:var(--text);font-weight:600}
  .review .controls{margin:.6rem 0 0}

  /* Vista A: cuadrícula */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0 3rem}
  .grid a{aspect-ratio:1/1;border:1px solid var(--line);border-radius:.9rem;text-decoration:none;
    display:flex;flex-direction:column;justify-content:space-between;padding:.8rem;transition:border-color .15s}
  .grid a:hover{border-color:var(--pink)}
  .grid .n{font:600 1.9rem/1 "Inter",system-ui,sans-serif;letter-spacing:-.03em}
  .grid .d{font:400 .7rem/1.3 "Inter",system-ui,sans-serif;color:var(--muted);min-height:1em}
  .grid a.new{position:relative}
  .grid a.new::after{content:"";position:absolute;top:.8rem;right:.8rem;width:.45rem;height:.45rem;border-radius:50%;background:var(--pink)}


  /* Pulso secuencial */
  .grid a{position:relative;overflow:hidden}
  .grid .n,.grid .d{position:relative;z-index:1}
  .pulse{position:absolute;z-index:0;left:50%;top:50%;width:0;height:0;pointer-events:none}
  .pulse i{position:absolute;left:0;top:0;border-radius:50%;opacity:0;transform:translate(-50%,-50%);will-change:transform,opacity;filter:blur(.5px);box-shadow:0 0 8px color-mix(in srgb,var(--pink) 35%,transparent)}
  .pulse .p0{width:10px;height:10px;background:var(--pink);box-shadow:0 0 10px color-mix(in srgb,var(--pink) 60%,transparent)}
  .pulse .p1{width:30px;height:30px;border:1.5px solid color-mix(in srgb,var(--pink) 85%,transparent)}
  .pulse .p2{width:54px;height:54px;border:1.5px solid color-mix(in srgb,var(--pink) 85%,transparent)}
  .pulse .p3{width:80px;height:80px;border:1.5px solid color-mix(in srgb,var(--pink) 85%,transparent)}
  .ping .p0{animation:step .55s cubic-bezier(.4,0,.2,1) both 0s}
  .ping .p1{animation:step .55s cubic-bezier(.4,0,.2,1) both .2s}
  .ping .p2{animation:step .55s cubic-bezier(.4,0,.2,1) both .4s}
  .ping .p3{animation:step .55s cubic-bezier(.4,0,.2,1) both .6s}
  @keyframes step{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}40%{opacity:1;transform:translate(-50%,-50%) scale(.95)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}}
  @media (prefers-reduced-motion:reduce){.ping i{animation:none!important}}
  /* Vista B: lista */
  ol.list{list-style:none;margin:1rem 0 3rem;padding:0}
  ol.list li{border-bottom:1px solid var(--line)}
  ol.list a{display:flex;align-items:baseline;gap:1rem;padding:1.1rem 0;text-decoration:none}
  ol.list .n{font:600 1.35rem "Inter",system-ui,sans-serif;min-width:3.5rem;letter-spacing:-.02em}
  ol.list .d{font:400 .85rem "Inter",system-ui,sans-serif;color:var(--muted);flex:1}
  ol.list .r{font:400 .8rem "Inter",system-ui,sans-serif;color:var(--muted)}
  ol.list a:hover .n{color:var(--pink)}

  /* Vista C: índice */
  .flow{margin:1.25rem 0 3rem;font:600 2.6rem/1.35 "Inter",system-ui,sans-serif;letter-spacing:-.03em}
  .flow a{text-decoration:none;margin-right:.55em;display:inline-block}
  .flow a:hover{color:var(--pink)}

  article{padding:3rem 0 2rem}
  .back{display:inline-block;font:500 .9rem "Inter",system-ui,sans-serif;color:var(--muted);text-decoration:none;margin-bottom:2rem;padding:.5rem 0}
  .back:hover{color:var(--text)}
  .bignum{font:600 3.5rem/1 "Inter",system-ui,sans-serif;letter-spacing:-.04em;margin:0}
  .date{font:400 .85rem "Inter",system-ui,sans-serif;color:var(--muted);margin:.85rem 0 2.25rem;min-height:.5rem}
  .body p{margin:0 0 1.4em}
  .body a{text-decoration-color:var(--pink);text-underline-offset:.2em;word-break:break-all}
  .ph{font:400 .85rem/1.5 "Inter",system-ui,sans-serif;color:var(--muted);border:1px dashed var(--line);border-radius:.75rem;padding:.85rem 1rem;margin:0 0 1.4em}
  .grid .hash,.flow .hash,ol.list .hash,nav.pn .hash{color:#c4c4c4}
  [data-theme="dark"] .grid .hash,[data-theme="dark"] .flow .hash,[data-theme="dark"] ol.list .hash,[data-theme="dark"] nav.pn .hash{color:#555}
  .grid a:hover .hash,.flow a:hover .hash,ol.list a:hover .hash,nav.pn a:hover .hash{color:var(--pink)}
  .end{display:block;width:.5rem;height:.5rem;border-radius:50%;background:var(--pink);margin:2.5rem 0 0}

  nav.pn{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;border-top:1px solid var(--line);padding:1.5rem 0 3rem}
  nav.pn a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:.75rem;padding:.9rem 1rem}
  nav.pn a:hover{border-color:var(--pink)}
  nav.pn .k{display:block;font:500 .75rem "Inter",system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  nav.pn .v{font:600 1.1rem "Inter",system-ui,sans-serif}
  nav.pn .next{text-align:right;grid-column:2}

  footer{color:var(--muted);font:400 .8rem "Inter",system-ui,sans-serif;text-align:center;padding:2rem 0 3rem}
  .progress{position:fixed;top:0;left:0;height:2px;background:var(--pink);width:0;z-index:6}

  @media (min-width:768px){
    :root{--fs:1.25rem}
    .intro{padding:4.5rem 0 1.5rem}
    .intro h1{font-size:2.5rem}
    .grid{grid-template-columns:repeat(5,1fr)}
    article{padding:4.5rem 0 2.5rem}
    .bignum{font-size:4.25rem}
    .flow{font-size:3.25rem}
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio">fer.dimc</a>
    <div class="tools">
      <button class="btn" id="smaller" aria-label="Texto más pequeño">A−</button>
      <button class="btn" id="bigger" aria-label="Texto más grande">A+</button>
      <button class="btn" id="theme" aria-label="Cambiar modo claro u oscuro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>diazmoralescarlos</footer>

<script>
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fdate(d,t){ if(!d) return ""; const [dd,mm,yy]=d.split("/").map(Number);
  let s=`${dd} de ${MESES[mm-1]} de ${2000+yy}`; if(t) s+=` · ${t.replace(/(am|pm)$/," $1")}`; return s; }
function sdate(d){ if(!d) return ""; const [dd,mm,yy]=d.split("/").map(Number); return `${dd} ${MESES[mm-1].slice(0,3)} ${String(yy)}`; }
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify=s=>esc(s).replace(/https?:\/\/\S+/g,u=>`<a href="${u}">${u}</a>`).replace(/\n/g,"<br>");
const num=n=>`<span class="hash">#</span>${n}`;
const PH=/^\[\[AGREGAR AQUÍ:\s*(.*?)\]\]$/;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const app=document.getElementById("app");
let POSTS=[], NEWEST=0;

// Parse one entry file: header lines "numero: / fecha: / hora:", blank line, then paragraphs separated by blank lines
function parseEntry(txt){
  txt=txt.replace(/\r\n?/g,"\n").replace(/^﻿/,"");
  const cut=txt.indexOf("\n\n"); const head=cut<0?txt:txt.slice(0,cut), body=cut<0?"":txt.slice(cut+2);
  const h={}; head.split("\n").forEach(l=>{const m=l.match(/^\s*(numero|fecha|hora)\s*:\s*(.*)$/i); if(m) h[m[1].toLowerCase()]=m[2].trim();});
  return {n:parseInt(h.numero,10), d:h.fecha||"", t:(h.hora||"").replace(/\s+/g,""), paras:body.split(/\n\s*\n/).map(x=>x.replace(/\s+$/,"")).filter(x=>x.trim())};
}
function setup(raw){
  POSTS=raw.map((p,k)=>({...p,k}));
  const seen={},cnt={}; POSTS.forEach(p=>seen[p.n]=(seen[p.n]||0)+1);
  POSTS.forEach((p,i)=>{p.i=i; if(seen[p.n]>1){cnt[p.n]=(cnt[p.n]||0)+1;p.id=p.n+"abcdef"[cnt[p.n]-1]} else p.id=String(p.n);});
  NEWEST=POSTS.reduce((m,p)=>p.n>m?p.n:m,0);
}

function renderIndex(){
  app.innerHTML=`
    <section class="intro">
      <h1>Todo lo que te quiero decir y no puedo</h1>
      <p>${POSTS.length} entradas</p>
    </section>
    <div class="grid">${POSTS.map(p=>`<a href="#entrada-${p.id}" class="${p.n===NEWEST?"new":""}"><span class="n">${num(p.n)}</span><span class="d">${sdate(p.d)}</span><span class="pulse" aria-hidden="true"><i class="p0"></i><i class="p1"></i><i class="p2"></i><i class="p3"></i></span></a>`).join("")}</div>`;
  loadPending=true; watchTiles();
  document.title=BLOG;
}

// Pulses: 4 per run. On load: first entry, then 3 random on screen. After each scroll stops: 4 random on screen.
let loadPending=false, pulseTimer=null, runId=0, visible=new Set(), io=null, tiles=[], scrollWait=null, quietUntil=0;
const reduced=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function watchTiles(){
  if(io) io.disconnect(); visible=new Set();
  tiles=[...document.querySelectorAll(".grid a")];
  io=new IntersectionObserver(es=>{
    let entered=false;
    es.forEach(e=>{const i=tiles.indexOf(e.target); if(e.isIntersecting&&e.intersectionRatio>.6){ if(!visible.has(i)) entered=true; visible.add(i);} else visible.delete(i);});
    if(!visible.size) return;
    if(loadPending){ loadPending=false; runPulses(true); return; }
    // New tiles came into view = the reader scrolled (works even when the page is inside another page's scroll)
    if(entered){ stopPulses(); clearTimeout(scrollWait); scrollWait=setTimeout(()=>runPulses(false),300); }
  },{threshold:[0,.6,1]});
  tiles.forEach(t=>io.observe(t));
}
function stopPulses(){ runId++; clearTimeout(pulseTimer); tiles.forEach(t=>t.classList.remove("ping")); }
function runPulses(startWithFirst){
  stopPulses(); if(reduced()||!tiles.length) return;
  const my=runId; let count=0, last=-1;
  const step=()=>{
    if(my!==runId||!document.body.contains(tiles[0])) return;
    tiles.forEach(t=>t.classList.remove("ping"));
    if(count>=4) return;
    const vis=[...visible].sort((a,b)=>a-b); if(!vis.length){ pulseTimer=setTimeout(step,300); return; }
    let idx;
    if(startWithFirst&&count===0) idx=vis[0];
    else { const pool=vis.length>1?vis.filter(i=>i!==last):vis; idx=pool[Math.floor(Math.random()*pool.length)]; }
    const el=tiles[idx]; void el.offsetWidth; el.classList.add("ping"); last=idx; count++;
    pulseTimer=setTimeout(step,1250);
  };
  pulseTimer=setTimeout(step,startWithFirst?400:150);
}
addEventListener("scroll",()=>{
  if(location.hash.startsWith("#entrada")||Date.now()<quietUntil) return;
  stopPulses(); clearTimeout(scrollWait); scrollWait=setTimeout(()=>runPulses(false),250);
},{passive:true});

function renderPost(p){
  stopPulses(); if(io) io.disconnect();
  const prev=POSTS[p.i-1], next=POSTS[p.i+1];
  app.innerHTML=`
    <article>
      <a class="back" href="#inicio">← Todas las entradas</a>
      <h1 class="bignum">${num(p.n)}</h1>
      <p class="date">${fdate(p.d,p.t)}</p>
      <div class="body">${p.paras.map(x=>{const m=x.trim().match(PH); return m?`<div class="ph">Aquí va ${esc(m[1])}.</div>`:`<p>${linkify(x)}</p>`}).join("")}</div>
      <span class="end" aria-hidden="true"></span>
    </article>
    <nav class="pn">
      ${prev?`<a href="#entrada-${prev.id}"><span class="k">← Anterior</span><span class="v">${num(prev.n)}</span></a>`:""}
      ${next?`<a class="next" href="#entrada-${next.id}"><span class="k">Siguiente →</span><span class="v">${num(next.n)}</span></a>`:""}
    </nav>`;
  document.title=`#${p.n} · ${BLOG}`;
}

function route(){
  const m=location.hash.match(/^#entrada-(\w+)$/);
  const p=m&&POSTS.find(x=>x.id===m[1]);
  quietUntil=Date.now()+600; window.scrollTo(0,0);
  p?renderPost(p):renderIndex(); onScroll();
}
const sizes=[1.0625,1.1875,1.3125,1.4375]; let si=+(store.get("si")??-1);
function applySize(){ if(si>=0) document.documentElement.style.setProperty("--fs",sizes[si]+"rem"); }
document.getElementById("bigger").onclick=()=>{si=Math.min(sizes.length-1,(si<0?1:si)+1);store.set("si",si);applySize()};
document.getElementById("smaller").onclick=()=>{si=Math.max(0,(si<0?1:si)-1);store.set("si",si);applySize()};
applySize();
let theme=store.get("theme2")||"light";
const applyTheme=()=>document.documentElement.dataset.theme=theme; applyTheme();
document.getElementById("theme").onclick=()=>{theme=theme==="dark"?"light":"dark";store.set("theme2",theme);applyTheme()};
const bar=document.getElementById("progress");
function onScroll(){const h=document.documentElement.scrollHeight-innerHeight;bar.style.width=(h>0&&location.hash.startsWith("#entrada")?scrollY/h*100:0)+"%"}
addEventListener("scroll",onScroll,{passive:true});
addEventListener("hashchange",route);
const BLOG=document.querySelector(".brand").textContent.trim();
(async()=>{
  try{
    const list=(await (await fetch("entradas/lista.txt",{cache:"no-cache"})).text()).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const files=await Promise.all(list.map(f=>fetch("entradas/"+f,{cache:"no-cache"}).then(r=>r.text())));
    setup(files.map(parseEntry)); route();
  }catch(e){ app.innerHTML='<p style="padding:3rem 0">No se pudieron cargar las entradas.</p>'; }
})();
</script>
</body>
</html>
